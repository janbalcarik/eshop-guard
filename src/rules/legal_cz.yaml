# Povinné informace e-shopu v Česku. Návrh k odladění a právní kontrole.
version: "legal-cz-2026-10-01-draft4"
module: legal
applies_to: legal_paragraph
jurisdictions: [cz]
presence_threshold: 0.7
questions:
  legal_adr:
    type: yes_no
    text_en: "Does this text name the body for out-of-court resolution of consumer disputes (for example the Czech Trade Inspection Authority, ČOI) or link to its website?"
    text_cs: "Uvádí tento text subjekt mimosoudního řešení spotřebitelských sporů (např. Českou obchodní inspekci) nebo odkaz na jeho web?"
  legal_complaints:
    type: yes_no
    text_en: "Does this text explain how or where a customer can make a complaint about defective goods, that is, exercise the right from defective performance? Answer no if it only mentions complaints without saying how or where to make them."
    text_cs: "Vysvětluje tento text, jak nebo kde může zákazník reklamovat vadné zboží, tedy uplatnit právo z vadného plnění? Pokud reklamace jen zmiňuje a neříká, jak nebo kde je uplatnit, odpověz ne."
  legal_withdrawal:
    type: yes_no
    text_en: "Does this text inform the consumer about the right to withdraw from a contract concluded at a distance, including the time limit and the procedure?"
    text_cs: "Informuje tento text spotřebitele o právu odstoupit od smlouvy uzavřené na dálku, včetně lhůty a postupu?"
  legal_withdrawal_form:
    type: yes_no
    text_en: "Does this text contain a model withdrawal form or a link to one?"
    text_cs: "Obsahuje tento text vzorový formulář pro odstoupení od smlouvy nebo odkaz na něj?"
  # Zákon č. 159/2026 Sb., účinnost 1. 1. 2027 (rules/CHANGELOG.md); znění otázek z podklady/reserse/cz-informacni-povinnosti.md, cz_withdrawal_button.
  legal_withdrawal_online_option:
    type: yes_no
    text_en: "Does this text say that the consumer can withdraw from the contract online, using a button, link or form on the website?"
    text_cs: "Uvádí tento text, že spotřebitel může od smlouvy odstoupit online pomocí tlačítka, odkazu nebo formuláře na webu?"
  legal_withdrawal_button_location:
    type: yes_no
    text_en: "Does this text say where on the website the withdrawal button or form can be found, for example a web address, a page name or a menu item? Answer no if no such button or form is mentioned."
    text_cs: "Uvádí tento text, kde na webu lze tlačítko nebo formulář pro odstoupení najít, například webovou adresu, název stránky nebo položku menu? Pokud text takové tlačítko ani formulář nezmiňuje, odpověz ne."

rules:
  - id: legal_adr_missing
    scope: site_presence
    question: legal_adr
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: cz, ref: "§ 14 odst. 1 zákona č. 634/1992 Sb., o ochraně spotřebitele", status: to_verify}
      - {jurisdiction: cz, ref: "§ 1820 odst. 1 písm. s) zákona č. 89/2012 Sb., občanský zákoník", status: to_verify}
  - id: legal_complaints_missing
    scope: site_presence
    question: legal_complaints
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: cz, ref: "§ 13 zákona č. 634/1992 Sb., o ochraně spotřebitele", status: to_verify}
  - id: legal_withdrawal_missing
    scope: site_presence
    question: legal_withdrawal
    code_checks:
      - {type: regex_required, pattern: '(?i)(14|čtrnáct\w*)\s*-?\s*(dn|den)'}
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: cz, ref: "§ 1820 odst. 1 písm. i) zákona č. 89/2012 Sb., občanský zákoník", status: to_verify}
  - id: legal_withdrawal_form_missing
    scope: site_presence
    question: legal_withdrawal_form
    severity: medium
    checkability: text
    legal_refs:
      - {jurisdiction: cz, ref: "§ 1820 odst. 1 písm. i) zákona č. 89/2012 Sb., občanský zákoník", status: to_verify}
  # Tlačítko „Odstoupit od smlouvy“ (§ 1830a OZ ve znění zákona č. 159/2026 Sb., od 1. 1. 2027). Stejné logické pravidlo jako
  # slovenské legal_withdrawal_function_missing (jeden nález s verdikty SK a CZ). Vzor je nápis předepsaný zákonem, ne slovník
  # pro klasifikaci; jinou „odpovídající jednoznačnou formulaci“ nepozná a tlačítko může být jen v účtu zákazníka, proto verify.
  - id: legal_withdrawal_function_missing
    scope: site_signal
    code_checks:
      - {type: site_pattern_required, where: links, pattern: '(?im)^\s*odstoupit\s+od\s+smlouvy\b'}
    severity: high
    checkability: verify
    effective_from: {cz: 2027-01-01}
    legal_refs:
      - {jurisdiction: eu, ref: "Směrnice 2011/83/EU, čl. 11a, vložený směrnicí (EU) 2023/2673 (použije se od 19. 6. 2026)", status: to_verify}
      - {jurisdiction: cz, ref: "§ 1830a odst. 1 a 2 zákona č. 89/2012 Sb., občanský zákoník, ve znění zákona č. 159/2026 Sb. (účinnost od 1. 1. 2027)", status: to_verify}
  - id: legal_withdrawal_button_info_missing
    scope: site_presence
    question: legal_withdrawal_online_option
    severity: high
    checkability: text
    effective_from: {cz: 2027-01-01}
    legal_refs:
      - {jurisdiction: cz, ref: "§ 1820 odst. 1 písm. i) zákona č. 89/2012 Sb., občanský zákoník, ve znění zákona č. 159/2026 Sb. (účinnost od 1. 1. 2027)", status: to_verify}
  - id: legal_withdrawal_button_location_missing
    scope: site_presence
    question: legal_withdrawal_button_location
    severity: high
    checkability: text
    effective_from: {cz: 2027-01-01}
    legal_refs:
      - {jurisdiction: cz, ref: "§ 1820 odst. 1 písm. i) zákona č. 89/2012 Sb., občanský zákoník, ve znění zákona č. 159/2026 Sb. (účinnost od 1. 1. 2027)", status: to_verify}
