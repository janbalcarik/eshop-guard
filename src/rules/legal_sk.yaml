# Povinné informácie e-shopu na Slovensku (primárny trh). Zapnuté 26. 9. 2026; ustanovenia ešte skontroluje právnik (status „ověřit“).
# Pole text_cs obsahuje otázku v jazyku krajiny, tu po slovensky.
# Ustanovenia sú overené v konsolidovanom znení zákona č. 108/2024 Z. z. od 27. 9. 2026, v zákone č. 310/2025 Z. z. (čl. V účinnosť),
# v zákone č. 391/2015 Z. z. (§ 11), vo vykonávacom nariadení (EÚ) 2025/1960 a v smernici (EÚ) 2023/2673 (podklady/predpisy-sk, predpisy-eu).
# Pravidlá site_signal hľadajú znak na celom webe (obrázok, odkaz alebo text); košík, pokladňu a zákaznícky účet nástroj nesťahuje,
# preto je chýbajúci znak vždy nález na overenie.
version: "legal-sk-2026-09-26-draft4"
module: legal
applies_to: legal_paragraph
jurisdictions: [sk]
enabled: true
presence_threshold: 0.7
questions:
  legal_adr:
    type: yes_no
    text_en: "Does this text give the web address of, or refer to a website with, information about the body for alternative (out-of-court) resolution of consumer disputes that the consumer can turn to? Answer no if an authority such as the Slovak Trade Inspection (SOI) is only named as the supervisory authority, or if the only reference is to the EU online dispute resolution (ODR) platform at ec.europa.eu/consumers/odr."
    text_cs: "Uvádza tento text adresu webového sídla alebo odkaz na webové sídlo s informáciami o subjekte alternatívneho riešenia spotrebiteľských sporov, na ktorý sa spotrebiteľ môže obrátiť? Ak je orgán, napríklad Slovenská obchodná inšpekcia (SOI), uvedený len ako orgán dozoru, alebo ak text odkazuje len na platformu EÚ na riešenie sporov online (ec.europa.eu/consumers/odr), odpovedz nie."
  legal_redress_request:
    type: yes_no
    text_en: "Does this text tell the consumer that they have the right to send the trader a request for redress when they are not satisfied with how the trader dealt with their complaint or believe that the trader has violated their rights? Answer no if it only describes how to file a complaint about defective goods."
    text_cs: "Poučuje tento text spotrebiteľa, že má právo podať obchodníkovi žiadosť o nápravu, ak nie je spokojný so spôsobom, akým obchodník vybavil jeho reklamáciu, alebo ak sa domnieva, že obchodník porušil jeho práva? Ak text len opisuje, ako reklamovať vadný tovar, odpovedz nie."
  legal_complaints:
    type: yes_no
    text_en: "Does this text explain how or where a customer can make a complaint about defective goods, that is, claim the seller's liability for defects? Answer no if it only mentions complaints without saying how or where to make them."
    text_cs: "Vysvetľuje tento text, ako alebo kde môže zákazník reklamovať vadný tovar, teda uplatniť zodpovednosť predávajúceho za vady? Ak reklamácie len spomína a nehovorí, ako alebo kde ich uplatniť, odpovedz nie."
  legal_withdrawal:
    type: yes_no
    text_en: "Does this text inform the consumer about the right to withdraw from a contract concluded at a distance, including the time limit and the procedure?"
    text_cs: "Informuje tento text spotrebiteľa o práve odstúpiť od zmluvy uzavretej na diaľku vrátane lehoty a postupu?"
  legal_withdrawal_form:
    type: yes_no
    text_en: "Does this text contain a model withdrawal form or a link to one?"
    text_cs: "Obsahuje tento text vzorový formulár na odstúpenie od zmluvy alebo odkaz naň?"

rules:
  - id: legal_adr_missing
    title: "Chýba odkaz na informácie o subjekte alternatívneho riešenia sporov"
    scope: site_presence
    question: legal_adr
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: sk, ref: "§ 5 ods. 1 písm. q) a ods. 3 zákona č. 108/2024 Z. z. v znení od 27. 9. 2026 (do 26. 9. 2026 písm. l)", status: "ověřit"}
    explanation: "Predávajúci musí spotrebiteľa poučiť o práve podať žiadosť o nápravu s uvedením odkazu na webové sídlo, na ktorom sú zverejnené informácie o príslušnom subjekte alternatívneho riešenia sporov. Uvedenie SOI len ako orgánu dozoru alebo odkaz na zrušenú platformu ODR túto povinnosť nesplní."
    recommendation: "Doplňte do obchodných podmienok odkaz na webové sídlo s informáciami o príslušnom subjekte alternatívneho riešenia sporov (pri bežnom tovare SOI)."
  - id: legal_redress_request_missing
    title: "Chýba poučenie o práve podať žiadosť o nápravu"
    scope: site_presence
    question: legal_redress_request
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: sk, ref: "§ 5 ods. 1 písm. q) zákona č. 108/2024 Z. z. v znení od 27. 9. 2026; § 11 zákona č. 391/2015 Z. z.", status: "ověřit"}
    explanation: "Súčasťou povinných informácií je poučenie, že spotrebiteľ môže obchodníkovi podať žiadosť o nápravu, ak nie je spokojný s vybavením reklamácie alebo sa domnieva, že obchodník porušil jeho práva."
    recommendation: "Doplňte do obchodných podmienok poučenie o práve podať žiadosť o nápravu a kam ju poslať."
  - id: legal_complaints_missing
    title: "Chýba informácia o reklamáciách"
    scope: site_presence
    question: legal_complaints
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: sk, ref: "§ 5 ods. 1 písm. f) zákona č. 108/2024 Z. z.; § 622 a nasl. Občianskeho zákonníka", status: "ověřit"}
    explanation: "Predávajúci musí informovať o zodpovednosti za vady a o spôsobe a mieste uplatnenia reklamácie."
    recommendation: "Doplňte reklamačný poriadok vrátane miesta a spôsobu uplatnenia reklamácie."
  - id: legal_withdrawal_missing
    title: "Chýba informácia o odstúpení od zmluvy"
    scope: site_presence
    question: legal_withdrawal
    code_checks:
      - {type: regex_required, pattern: '(?i)(14|štrnásť\w*)\s*-?\s*(dn|dň|den)'}
    severity: high
    checkability: text
    legal_refs:
      - {jurisdiction: sk, ref: "§ 15 ods. 1 písm. f) až i) a § 19 zákona č. 108/2024 Z. z.", status: "ověřit"}
    explanation: "Pred uzavretím zmluvy na diaľku musí spotrebiteľ dostať podmienky, lehotu a postup na odstúpenie."
    recommendation: "Doplňte podmienky, 14-dňovú lehotu a postup na odstúpenie."
  - id: legal_withdrawal_form_missing
    title: "Chýba vzorový formulár na odstúpenie"
    scope: site_presence
    question: legal_withdrawal_form
    severity: medium
    checkability: text
    legal_refs:
      - {jurisdiction: sk, ref: "Príloha č. 2 zákona č. 108/2024 Z. z.", status: "ověřit"}
    explanation: "Spolu s poučením o odstúpení musí spotrebiteľ dostať vzorový formulár."
    recommendation: "Pridajte vzorový formulár na odstúpenie od zmluvy."

  # Nové povinnosti, ktoré sa dajú overiť len na celom webe (obrázok, odkaz, text).
  - id: legal_harmonized_notice_missing
    title: "Chýba harmonizované oznámenie o zákonnej zodpovednosti za vady (nové od 27. 9. 2026)"
    scope: site_signal
    code_checks:
      - {type: site_pattern_required, pattern: '(?i)harmonizovan\w*[\s_-]+ozn[aá]men|harmoni[sz]ed[\s_-]+notice|legal[\s_-]*guarantee|z[aá]konn\w*[\s_-]+z[aá]ruk\w*[\s_-]+s[uú]ladu|youreurope[^\s]*guarantee|minim[aá]ln\w*\s+dvojro[cč]n'}
    severity: high
    checkability: verify
    legal_refs:
      - {jurisdiction: eu, ref: "Směrnice 2011/83/EU, čl. 5 odst. 1 písm. e), čl. 6 odst. 1 písm. l) a čl. 22a odst. 1 a 3, ve znění směrnice (EU) 2024/825; prováděcí nařízení Komise (EU) 2025/1960, čl. 1 a příloha I", status: "ověřit"}
      - {jurisdiction: sk, ref: "§ 5 ods. 1 písm. f) zákona č. 108/2024 Z. z. v znení zákona č. 310/2025 Z. z. (účinnosť od 27. 9. 2026)", status: "ověřit"}
    explanation: "Od 27. 9. 2026 musí e-shop pred objednávkou zreteľne informovať o zákonnej zodpovednosti za vady vrátane jej dĺžky, a to aspoň v podobe a rozsahu harmonizovaného oznámenia EÚ: farebného obrázka s QR kódom na portál Vaša Európa, ktorý sa nesmie upravovať. Text v obchodných podmienkach (napríklad „Zákonná záruka je 24 mesiacov“) túto podobu nenahrádza."
    recommendation: "Zobrazte farebné harmonizované oznámenie podľa prílohy I nariadenia (EÚ) 2025/1960 bez úprav na stránke produktu alebo v pokladni pred odoslaním objednávky; ak ho už máte, doplňte k obrázku popis (alt), aby bolo dohľadateľné."
  - id: legal_withdrawal_function_missing
    title: "Chýba funkcia „odstúpiť od zmluvy tu“ (povinná od 19. 6. 2026)"
    scope: site_signal
    code_checks:
      - {type: site_pattern_required, where: links, pattern: '(?i)\bodst[uú]pi[tť]\s+od\s+zmluvy\b|\bodst[uú]penie\s+od\s+zmluvy\s+online\b'}
    severity: high
    checkability: verify
    legal_refs:
      - {jurisdiction: eu, ref: "Směrnice 2011/83/EU, čl. 11a, vložený směrnicí (EU) 2023/2673 (použije se od 19. 6. 2026)", status: "ověřit"}
      - {jurisdiction: sk, ref: "§ 20a zákona č. 108/2024 Z. z. v znení zákona č. 311/2025 Z. z. (účinnosť od 19. 6. 2026)", status: "ověřit"}
    explanation: "E-shop musí spotrebiteľovi umožniť odstúpiť od zmluvy aj funkciou na odstúpenie, označenou „odstúpiť od zmluvy tu“ alebo obdobnou jednoznačnou formuláciou, zreteľne zobrazenou a nepretržite dostupnou počas celej lehoty na odstúpenie. Na prehľadaných stránkach sa nenašiel odkaz ani tlačidlo s takýmto označením."
    recommendation: "Doplňte zreteľne viditeľný odkaz alebo tlačidlo „odstúpiť od zmluvy tu“ (napríklad v pätičke a v zákazníckom účte) s online formulárom podľa § 20a ods. 3."
  - id: legal_odr_link_outdated
    title: "Odkaz na zrušenú platformu ODR"
    scope: site_signal
    code_checks:
      - {type: site_pattern_forbidden, where: all, pattern: '(?i)ec\.europa\.eu/consumers/odr'}
    severity: low
    checkability: text
    legal_refs:
      - {jurisdiction: eu, ref: "Nařízení (EU) 2024/3228, kterým se zrušuje nařízení (EU) č. 524/2013 s účinkem od 20. 7. 2025", status: "ověřit"}
      - {jurisdiction: sk, ref: "Zákon č. 310/2025 Z. z., čl. I body 1 a 46 (vypustenie odkazov na nariadenie (EÚ) č. 524/2013); § 5 ods. 1 písm. q) zákona č. 108/2024 Z. z.", status: "ověřit"}
    explanation: "Platforma EÚ na riešenie sporov online (ODR) bola 20. 7. 2025 zrušená. Odkaz na ňu už spotrebiteľa k informáciám o subjekte alternatívneho riešenia sporov nedovedie; ak je jediným odkazom, povinnosť podľa § 5 ods. 1 písm. q) nemusí byť splnená."
    recommendation: "Odkaz na platformu ODR odstráňte a nahraďte ho odkazom na informácie o príslušnom subjekte alternatívneho riešenia sporov (pri bežnom tovare SOI)."
