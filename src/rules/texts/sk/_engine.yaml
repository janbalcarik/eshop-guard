  mostly_script_rendered: "Web je z veľkej časti vykresľovaný JavaScriptom, kontrola je preto neúplná. Spoľahlivý výsledok dá pripojenie e-shopu cez konektor alebo produktový feed."
  profile_failed_fatal: "Profily šablón sa nevytvorili: {reason} Stránky bez profilu sa kontrolovali celé."
  profile_failed: "Profil šablóny stránky {url} sa nepodarilo vytvoriť ({reason}); jej {pages} stránok sa kontrolovalo celých."
