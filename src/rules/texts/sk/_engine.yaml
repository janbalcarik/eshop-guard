  evaluation_skipped: "vyhodnotenie neprebehlo"
  site_signals_not_evaluated: "kontrola textu bez celého webu, znaky na stránkach sa nehľadali"
  legal_texts_not_given: "nebol zadaný text právnej stránky"
  site_not_crawled: "web sa neprechádzal alebo sa z neho nestiahla žiadna stránka"
  no_rules_for_jurisdiction: "modul nemá pravidlá pre túto krajinu"
  rule_set_disabled: "sada pravidiel je vypnutá"
rules:
  legal_pages_missing:
    title: "Nenašli sa právne stránky"
    explanation: "Na webe sa nenašla žiadna stránka s obchodnými podmienkami, reklamačným poriadkom, informáciami o odstúpení, doprave ani kontaktmi, takže povinné informácie nebolo možné overiť."
    recommendation: "Zverejnite obchodné podmienky a reklamačný poriadok ako stránky webu a odkážte na ne z pätičky."
