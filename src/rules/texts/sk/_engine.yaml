# Texty nástroje ve slovenštině: poznámky k nálezům, upozornění běhu, důvody, stavy odkazů a vestavěný nález.
# Strojový návrh překladu z cs: nepoužije se, dokud ho nezkontroluje člověk (review). Zástupné symboly {název}
# nebo {název:formát} jsou stejné jako v cs; formát čísel a dat se řídí culture.
locale: sk
culture: "sk-SK"
review:
  machine_draft: true
  translated_by: "Claude (strojový návrh na žádost uživatele, 2. 10. 2026)"
  reviewed_by: ""
  reviewed_at: ""
  note: "Návrh překladu z cs. Nepoužije se, dokud ho člověk nezkontroluje: pak odstraňte machine_draft a vyplňte reviewed_by a reviewed_at."
jurisdictions:
  sk: "Slovensko"
  cz: "Česko"
codes:
  # Poznámky k pravidlům site_presence.
  presence_closest_paragraph: "Najbližší nájdený odsek má pravdepodobnosť {probability:0.00}, prah prítomnosti je {threshold:0.00}."
  presence_pattern_missing: "Na právnych stránkach chýba aj text zodpovedajúci vzoru {pattern}."
  presence_found_but_pattern_missing: "Jev informáciu našiel (pravdepodobnosť {probability:0.00}), ale na právnych stránkach chýba text zodpovedajúci vzoru {pattern}."
  presence_paragraphs_not_evaluated: "{count} odsekov právnych stránok sa nepodarilo vyhodnotiť, informácia môže byť v nich."
