  signal_found_on: "Nájdené na {count} z {total} stiahnutých stránok."
  # Poznámky ze seznamu zákonných požadavků (claim_list_match) a ke značkám (label_notes).
  claim_list_item: "Zoznam zákonných požiadaviek: {category}, „{feature}“. Základ: {basis}.{since}{remark}"
