  evaluation_not_confirmed_texts: "Vyhodnotenie Jevom nebolo potvrdené."
  jev_errors: "{errors} z {calls} volaní Jevu zlyhalo; tieto segmenty nie sú vyhodnotené (podrobnosti v run.log)."
