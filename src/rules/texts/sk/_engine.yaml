  profiles_not_created: "Profily {count} šablón sa nevytvorili ({reason}); ich stránky sa kontrolovali celé."
  model_mock: "falošný klient (--mock), profily sa nevytvárajú"
  model_missing_key: "chýba kľúč OpenAI (OPENAI_API_KEY)"
  sieve_unevaluated: "Sito nevyhodnotilo {count} úsekov (chyba alebo príliš dlhý text); ich vety prešli celou podrobnou kontrolou."
