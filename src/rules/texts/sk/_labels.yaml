# Poznámky ke značkám (sk), podle id z label_notes v labels.yaml.
# Strojový návrh překladu z cs: nepoužije se, dokud ho nezkontroluje člověk (review). Názvy značek a standardů zůstávají beze změny.
locale: sk
review:
  machine_draft: true
  translated_by: "Claude (strojový návrh na žádost uživatele, 2. 10. 2026)"
  reviewed_by: ""
  reviewed_at: ""
  note: "Návrh překladu z cs. Nepoužije se, dokud ho člověk nezkontroluje: pak odstraňte machine_draft a vyplňte reviewed_by a reviewed_at."
notes:
  ecocert: "Ecocert: logo vyhovuje len so signatúrou „COSMOS ORGANIC“ alebo „COSMOS NATURAL“ (vtedy ide o certifikačný systém COSMOS). Vlastné štandardy Ecocertu (Ecodetergents, Natural/Organic Cosmetic) podmienky nespĺňajú, pretože vlastník systému je zároveň certifikátorom; oddelenie, ktoré Ecocert v roku 2026 pripravuje, nie je overené."
  bdih: "BDIH: logo so signatúrou COSMOS vyhovuje ako COSMOS. Starý štandard BDIH („Kontrollierte Natur-Kosmetik“) a značka Vegan BDIH sú neoverené: kontrolór IONC patrí výhradne BDIH a verejné dokumenty nedokladajú všetky podmienky certifikačného systému."
  icea: "ICEA: so signatúrou COSMOS vyhovuje ako COSMOS. Vlastné štandardy ICEA (Eco Bio Cosmesi, Natural Cosmetic, Eco Bio Detergenza, Vegetarian/Vegan) nevyhovujú, vlastník je totožný s certifikátorom."
  cosmebio: "Cosmébio: so signatúrou COSMOS vyhovuje ako COSMOS; staré logo podľa charty združenia je neoverené."
  soil_association: "Soil Association: logo so signatúrou COSMOS vyhovuje ako COSMOS; „Soil Association organic“ mimo kozmetiky certifikuje dcérska spoločnosť vlastníka bez doloženej akreditácie, je neoverené."
  ecogarantie: "Ecogarantie: neoverená. Kontroluje iná osoba ako vlastník (Certisys, TÜV NORD), ale akreditácia pre rozsah Ecogarantie doložená nie je a o odvolaní s konečnou platnosťou rozhoduje orgán vlastníka."
  cpk: "CPK a CPK bio: nevyhovujú, štandard, ochranné známky aj certifikát sú v rukách jednej organizácie (KEZ o.p.s.)."
  natural_cosmetics_standard: "NCS a NCP: neoverené; jediný viditeľný certifikačný orgán má akreditáciu len pre NATRUE a je spoluautorom štandardu. NCP navyše dovoľuje označenie „ecological“, ktoré je všeobecným environmentálnym tvrdením."
  the_vegan_society: "The Vegan Society (Vegan Trademark): produkty kontroluje sám vlastník, podmienku nezávislej kontroly nespĺňa. Značkou udržateľnosti je, len ak ju obchod v kontexte spája s prínosom pre zvieratá alebo prírodu (otázky a odpovede Komisie č. 15); vlastník sám uvádza, že nejde o environmentálnu certifikáciu."
  v_label: "V-Label: neoverená; ide o licenciu a externé audity nemajú doloženú akreditáciu. Na kozmetike od kritérií 02.03 (9/2026) neznamená „netestované na zvieratách“."
  beauty_without_bunnies: "PETA: vlastník sám uvádza, že jeho logá sa majú používať len v USA, Kanade a Indii, nie v EÚ, a smernicu (EÚ) 2024/825 nespĺňajú."
  leaping_bunny: "Leaping Bunny / Cruelty Free International: neoverená s vysokým rizikom; úplné kritériá sú len na vyžiadanie a kto vykonáva audity a s akou akreditáciou, nie je zverejnené."
  eve_vegan: "EVE VEGAN: nevyhovuje, kontrolu dokumentov, audit aj certifikát zabezpečuje sám vlastník."
  oeko_tex: "OEKO-TEX (STANDARD 100, MADE IN GREEN, ORGANIC COTTON, LEATHER STANDARD): neoverená, dva certifikačné inštitúty sú akcionármi vlastníka systému; STANDARD 100 je hlavne zdravotná značka. OEKO-TEX STeP sa na výrobku použiť nesmie."
  bluesign: "bluesign: bluesign PRODUCT, bluesign APPROVED a bluepass Article nevyhovujú; bluepass Consumer Product je neoverený."
  cradle_to_cradle_certified: "Cradle to Cradle Certified: nevyhovuje podmienkam certifikačného systému."
  fair_wear: "Fair Wear: nie je certifikačný systém výrobkov, ako značka na výrobku nevyhovuje."
  fair_for_life: "Fair for Life: nevyhovuje (k 26. 9. 2026), vlastník štandardu je totožný s certifikátorom."
  ok_compost: "OK compost a OK biobased (TÜV AUSTRIA): nevyhovujú, podmienka kontroly nezávislou treťou stranou nie je splnená."
  bci_cotton: "Better Cotton: BCI Cotton Label je neoverený; staré logo Better Cotton a členské logo na výrobku nevyhovujú."
  climatepartner: "ClimatePartner: „ClimatePartner certified“ je neoverený, „ClimatePartner verified“ v EÚ nevyhovuje. Tvrdenia o klimatickej neutralite založené na kompenzáciách sú zakázané vždy (bod 8)."
  b_corp: "Certified B Corporation: neoverená; „Pending B Corp“ je len sebahodnotenie a nevyhovuje."
  1_for_the_planet: "1 % for the Planet: „CERTIFIED“ je neoverené, členské logo „MEMBER“ nevyhovuje."
  uebt_member: "„UEBT member“ je členské logo, nie certifikácia; vyhovuje len „UEBT certified“."
  demeter: "Súkromné a zahraničné bio značky (Demeter, Naturland, Bioland, Bio Austria, USDA Organic) sú podľa rešerše neoverené: verejné dokumenty nedokladajú všetky podmienky certifikačného systému. Pri biopotravinách rozhoduje certifikácia podľa nariadenia (EÚ) 2018/848 (logo EÚ pre ekologickú výrobu)."
