# Zákonné požadavky platné pro všechny výrobky kategorie na trhu EU a tvrzení, která je vydávají za přednost:
# SK zákon č. 108/2024 Z. z., príloha č. 1 bod 15 (od 27. 9. 2026), EU směrnice 2005/29/ES, příloha I bod 10a.
# Zdroj: podklady/reserse/zakonne-poziadavky-ako-prednost.md (26. 9. 2026), oddíl 3.4 a příloha A; screening, ne právní
# posouzení, všechny položky mají status „ověřit“. Vygenerováno z testovacího skriptu rešerše (pozitivní i negativní
# věty jsou v tests/EshopGuard.Core.Tests/Fixtures/legal_requirements_cases.json).
#
# outcome (SK, bod 15): text = zákonný požadavek na všechny výrobky kategorie; verify = limit, výjimky nebo přechodné
# období (k ověření); none = nad rámec zákona, smí zůstat; irrelevant = bezvýznamná výhoda (§ 10 ods. 2 písm. e), k ověření).
# outcome_cz: totéž pro Česko dnes (odvětvový předpis u potravin, kosmetiky a kojenecké výživy, jinak § 5); modul lr zatím
# běží jen pro Slovensko.
#
# Výraz tvrzení se skládá z položky se subst (subst_cz, subst_sk):
#   (?i)(?:\b{abs}\s+{gap}(?:{subst})|\bbez-?(?:{adj})|\b(?:{en})\s*-?\s*free\b|\bfree\s+(?:from|of)\s+(?:{en})|\b0\s*%\s*(?:{subst})|{extra})
#   abs = abs_cz nebo abs_sk; chybějící adj, en nebo extra se i s alternativou vynechají. Položka s claim se použije přímo.
# Kategorie výrobku se hledá v názvu produktu, nadpisu, drobečkové navigaci a kategorii e-shopu, ne ve větě.
macros:
  abs_cz: '(?:bez(?:\s+(?:obsahu|přídavku|přidan\w*|použití|přísady|přítomnosti))?|neobsahuj\w*|nemá|zbaven\w*|prost[ýáéí])'
  abs_sk: '(?:bez(?:\s+(?:obsahu|prídavku|pridan\w*|použitia|prísady|prítomnosti))?|neobsahuj\w*|nemá|zbaven\w*|prost[ýáéí])'
  gap: '(?:(?!(?:obsahuj\w*|ale|avšak|však|no|jen|len|iba|pouze|s|so|se)\b)[\w%-]+[\s,]+){0,3}?'
categories:
  laundry:
