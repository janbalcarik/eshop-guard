    sk: '(?i)\bprac(?:í|ieho|ích|ie)\s+(?:prostried\w*|gél\w*|prášok|prášk\w*|kapsul\w*|tablet\w*)|\b(?:gél|prášok|kapsuly|tablety)\s+na\s+pranie'
