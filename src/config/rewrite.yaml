      Tamtéž, question 7 (excerpt)
    source: "podklady/eu-komise/komise-qa-empco-2026-09.txt"
    text: |
      7. HOW CAN A TRADER DEMONSTRATE ‘RECOGNISED EXCELLENT ENVIRONMENTAL PERFORMANCE’ 
      IN ORDER TO LAWFULLY USE A GENERIC ENVIRONMENTAL CLAIM UNDER THE ECGT DIRECTIVE?  
      Under Article 2(p) and Annex I point 4a to the UCPD, as amended by Article 1(1)(b), (4) of 
      the ECGT Directive, a ‘generic environmental claim’ may only be used if it is based on 
      recognised excellent environmental performance.  If the specification of the environmental 
      claim is provided in clear and prominent terms on the same medium, such as the same 
      advertising spot, the product’s packaging or online selling interface, this will not be 
      considered a generic environmental claim.  
      According to Article 2(s) of the UCPD, as amended by Article 1(1)(b) of the ECGT Directive 
      ‘recognised excellent environ mental performance’ means ‘ environmental performance 
      compliant with Regulation (EC) No 66/2010 of the European Parliament and of the Council 
      or with national or regional EN ISO 14024 type I ecolabelling schemes officially recognised 
      in the Member States, or top environmental performance in accordance with other applicable 
      Union law’ . 
      A trader has three possible ways to demonstrate ‘recognised excellent environmental 
      performance’:  1) by compliance with the EU Ecolabel (Regulation (EC) No 66/2010)2;  2)   
      by compliance with national or regional EN ISO 14024 type I ecolabelling schemes3, officially 

      2 Therefore the products should be awarded with the EU Ecolabel. 
      3 Therefore the products should be awarded with these national or regional ecolabels.  

       11 
      recognised in the Member States, such as the Nordic Swan, Blue Angel, the Austrian 
      Ecolabel, or the Dutch Ecolabel (Milieukeur);  or 3) by compliance with top environmental 
      performance for a specific environmental characteristic in accordance with other applicable 
      Union laws, such as for example recognised excellent environmental performance in 
      accordance with the Energy Labelling Regulation.   
      It is important to highlight that the recognised excellent environmental performance in 
      question should be relevant to the claim. For example, a generic environmental claim on a 
      product such as ‘energy efficient’ could be made based on recognised excellent 
      environmental performance in accordance with, for example, the Energy Labelling 
      Regulation (Regulation (EU) 2017/1369). By contrast, a generic environmental claim such 
      as ‘biodegradable’ could not be made based on the EU Ecolabel, if there are no requirements 
      for biodegradability in the specific EU Ecolabel criteria related to the product in question. 
      As the scope of the EU Ecolabel is to promote products with a reduced environmental impact 
      during their entire life cycle, claims such as “better for the environment”, “environmentally 
      friendly”, “green”, “ecological” or “eco-friendly” can be used on products awarded with the 
      EU Ecolabel or national or regional EN ISO 14024 type I ecolabelling schemes officially 
      recognised in the Member States.  
      The only exception is for products that are mixtures (e.g. detergents, cosmetics, paints) 
      when they are labelled according to th e Classification, Labelling and Packaging (CLP) 
      Regulation4, as they need to comply with Article 25 (4) of that Regulation, according to 
