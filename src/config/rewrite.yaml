      Tamtéž, question 5
    source: "podklady/eu-komise/komise-qa-empco-2026-09.txt"
    text: |
      5. WHEN DESIGNING THE ARTWORK OF PACKAGING , SHOULD COMPANIES BE AWARE OF ANY 
      ELEMENTS (E.G. ART WITH GREEN LEAVES OR WATER DROPS) THAT WOULD RISK BEING CONSIDERED 
      TO CONTAIN A GENERIC ENVIRONMENTAL CLAIM OR A SUSTAINABILITY LABEL?  
      When designing packaging artwork, companies should be mindful that certain visual 
      elements, such as green leaves, water drops, or similar nature -related icons, may be 
      interpreted by consumers as implicit environmental claims, that in combination with a claim 
      made in written form or with a logo, depending on the context and presentation, could be 
      subject to the requirements of the ECGT Directive, such as related to generic environmental 
      claims or sustainability labels. 
      Overall, traders should exercise caution when using icons, symbols, images, or artwork that 
      could be perceived as (implicit) environmental claims or trust marks. For example, a green 
      leaf or water drop, when combined with logos or pos itioned next to statements about 
      sustainability or natural ingredients, may be seen by the average consumer as a voluntary 
      trust mark or quality mark.  
      Given the broad definition of sustainability labels in Article 2(1)(q) of the ECGT Directive 
      (‘any voluntary trust mark, quality mark or equivalent, either public or private, that aims to 
      set apart and promote a product, a process or a business by reference to its environmental 
      or social characteristics, or both, and excludes any mandatory label required under Union 
      or national law’), elements such as green leaves or water drops may fall within its scope 
      depending on the intended use, the overall context of the communication, and most 
      importantly, consumer perception.   
      Moreover, as already indicated in the current UCPD Guidance Notice ‘accordingly, also the 
      imagery and overall product presentation (i.e. layout, choice of colours, images, pictures, 
      sounds, symbols or labels), should be a truthful and accurate representation of the scale of 
      the environmental benefit, and should not overstate the benefit achieved. Implicit claims 
      may, depending on the circumstances of the case, include the use of images (e.g. trees, 
      rainforests, water, animals) and colours (e.g. blue or green backgrounds or text) that are 
      associated with environmental sustainability.’ (UCPD Guidance (2021/C 526/01) under
