      European Commission, Questions & Answers on Directive (EU) 2024/825 (September 2026), question 3 (excerpt)
    source: "podklady/eu-komise/komise-qa-empco-2026-09.txt"
    text: |
      Accordingly, brand names, and product names regardless of their protection under 
      intellectual property law may be assessed as environmental claims under the ECGT Directive 
      if they convey an environmental message, either explicitly or implicitly. This asses sment 
      must be made on a case-by-case basis, considering the overall commercial context, 
      including visual elements, product packaging, marketing, and whether the presentation is 
      likely to lead the average consumer to believe the product or brand has a positive or zero 
      impact on the environment or is less damaging to the environment than other products, 
      product categories, brands or traders, or has improved its impact over time. This also means 
      that the use of terms such as ‘green’ or ‘blue’ in a brand name, company name or product 
      name, or the use of such colours, does not automatically constitute an environmental 
      claim under the ECGT Directive, where, in the relevant commercial context, those terms or 
      colours are unlikely to lead the average consumer to expect that the brand, product 
      or company offers an environmental benefit. 
      However, if  terms such as ‘green’, ‘blue’, ‘eco’ ‘natural’ or ‘climate neutral’ are used in a 
      brand name or product name in a way that is likely to create an environmental 
      association for the average consumer, even without any other explicit advertising on 
      the environmental benefits of the brand of product, then such use may constitute an 
      environmental claim under the ECGT Directive. In that case, the trader would need to specify 
      the environmental claim in cle ar and prominent terms on the same medium. If no such 
      specification is provided, the claim is considered a generic environmental claim and must 
      comply with the corresponding requirements, and the trader must demonstrate the 
      recognised excellent environmental performance relevant to the claim made. According to 
      Article 4(3)(a) and Recital 40 of the Directive (EU) 2015/2436 to approximate the laws of 
      the Member States relating to trade marks (Recast), provisions relating to unfair competition
  - title: |
      Tamtéž, question 4
    source: "podklady/eu-komise/komise-qa-empco-2026-09.txt"
    text: |
      A generic environmental claim is defined in Article 2(p) of the UCPD, as amended by Article 
      1(1)(b) of the ECGT Directive, as follows: ‘any environmental claim made in written or oral 
      form, including through audiovisual media, that is not included on a sustainability label and 
      where the specification of the claim is not provide d in clear and prominent terms on the 
      same medium’.  
      This means that if a claim such as ‘gentle on the environment’, ‘nature’s friend’ or ‘green’ is 
      included on a sustainability label, it will not be considered as a generic environmental claim.  
      Such a sustainability label will be forbidden to be displayed if it is not based on a certification 
      scheme or not established by public authorities. However, as stated in Recital 8 of the ECGT 
      Directive, such labels can still be considered as constituting an environmental claim in the 
      sense of Article 2(o) of the UCPD, as amended by Article 1(1)(b) of the ECGT Directive, if it 
      is used in a way that suggests or creates the impression that a product has a positive or 
      zero impact on the environment, or is less damaging to the environment than competing 
      products. As such, claims made as part of a sustainability label can still be subject to other 
      relevant provisions of the UCPD. This should preclude traders from using sustainability labels 
      as a ‘safe haven’ for misleading or irrelevant claims.  
      Recital 9 of the ECGT Directive refers to examples of generic environmental claims such as 
      ‘environmentally friendly’, ‘eco -friendly’, ‘green’, ‘nature’s friend’, ‘ecological’, 
      ‘environmentally correct’, ‘climate friendly’, ‘gentle on the environment’, ‘carbon friendly’, 
      ‘energy efficient’, ‘biodegradable’, ‘biobased’ or similar statements that suggest excellent 
      environmental performance. These generic environmental claims are prohibited if 
      recognised excellent environmental performance cannot be demonstrated (Annex I point 4a 
      to the UCPD, as amended by Article 1(4) of the ECGT Directive). Recital 9 further clarifies 
      that:  
      ‘Whenever the specification of the environmental claim is provided in clear and prominent 
      terms on the same medium, such as the same advertising spot, the product’s packaging or 
      online selling interface, the environmental claim is not considered to be a generic 
      environmental claim.’ 
      For example, the claim ‘climate -friendly packaging’ (without further specifications)  is 
      considered a generic environmental claim and would be subject to the prohibition on such 
      claims unless it is based on recognised excellent environmental performance. In contrast, a 

       9 
      claim like ‘100% of energy used to produce this packaging comes from renewable sources’ 
      would be considered a specific environmental claim and does not fall under the prohibition 
      on generic environmental claims. However, whether such a claim is permitted ultimately 
      depends on the specific circumstances of the case, including how the claim is presented and 
      what evidence is provided to support it. The environmental claim must also comply with 
      other relevant provisions of the UCPD. 
      In practice, the specification of the claim should be provided next to, or as part of, the claim 
      in clear and prominent terms on the same medium (Recital 9 of the ECGT Directive and 
      Article 2(p) of the UCPD, as amended by Article 1(1)(b) of the ECGT Directive).  In the 
      current UCPD Guidance Notice, it is already highlighted that based on Article 7 of the UCPD 
      concerning misleading omissions ‘in case environmental claims are made on the packaging 
      of products or other communication channels (e.g. posters, billboards, magazines), which 
      have limited space for specifications, the location of the main environm ental claim and 
      supplementary information about the claim should enable an average consumer to 
      understand the link between both’ and ‘If there is no space to specify the environmental 
      claim, then the claim should generally not be made.’ (2021/C 526/01, 4.1 .1.4, page 80).  
      This remains valid and does not change through the ECGT Directive.
