schema: spec-driven

context: |
  Produkt: EshopGuard (dříve pracovně EshopGuard). Kontrola textů e-shopů podle spotřebitelského práva,
  primárně Slovensko (zákon 108/2024 Z. z. ve znění 310/2025, EmpCo od 27. 9. 2026), dále Česko.
  Texty vyhodnocuje TypeSafe Jev (klasifikátor, otázka -> skóre), přepisy textů OpenAI gpt-6.1-sol.

  Dnešní stav: knihovna EshopGuard.Core + tenké CLI (.NET 10), 192 offline testů, profily šablon stránek,
  síto po odstavcích, cache Jevu a přepisů zatím v SQLite (přechodně, změna 5b ji přesune do PostgreSQL). Žádná databáze, žádné API, žádný web.

  Cílová architektura (podklady v ../../*.md, hlavně architektura-multitenant-worker-2026-10-01.md
  a databaze-a-plan-implementace-2026-10-01.md):
  - Next.js frontend (aplikace + prezentační web s Payload CMS 3), ASP.NET Core API, N workerů (.NET Generic Host);
  - PostgreSQL 18 (data, fronta úloh SKIP LOCKED s leasy, limity, RLS po tenantech) + S3/MinIO;
  - workery i API se připojují přímo do DB v jedné privátní síti;
  - start na jednom serveru: Ubuntu 24.04 + Docker Compose (caddy, web, api, worker, postgres, walg -> S3);
  - platby Stripe (Checkout: jednorázová analýza + předplatné s 30denní zkušební dobou), faktury SuperFaktúra (SK e-faktúra Peppol od 1. 1. 2027);
  - vícejazyčnost od začátku (sk, cs; další trhy později), místa prodeje a jazykové verze e-shopu, verdikt nálezu po zemích.
  Návrh UI: soubory v design/ui/*.dc.html (předloha pro frontend, popis v design/ui/README.md), živé plátno https://claude.ai/artifact/34wYLsJzieFtmWdueAwYay (obrazovky Main, Login 2a–2c, Onboarding 3a–3d, Dashboard, Fixes, Review, GroupFix, Monitoring, Billing, Evidence, Protocol, Mobile).

  Závazné zásady:
  - logika v knihovně, CLI/API/worker jsou tenké vrstvy;
  - cache (odpovědi Jevu, přepisy, profily) jen v PostgreSQL, stejně pro CLI i aplikaci; žádné lokální soubory cache (SQLite se odstraní ve změně 5b);
  - aplikace i lokálně jako role eshopguard_app / eshopguard_worker (superuživatel obchází RLS), databáze eshopguard;
  - klíče (TYPESAFE_API_KEY, OPENAI_API_KEY, Stripe, SuperFaktúra) nikdy do logu, výstupu ani repozitáře;
  - před každým placeným voláním Jevu nebo LLM odhad ceny a souhlas; žádné slovníky klíčových slov pro klasifikaci;
  - robots.txt se dodržuje, User-Agent EshopGuard/0.1;
  - nic se tiše neskrývá ani neslučuje: co nebylo zkontrolováno, se uvede (fail-closed);
  - na právní výklad se nevymýšlí paragrafy; co nejde rozhodnout z textu zákona = „k ověření“;
  - LLM jen OpenAI (ne Anthropic); kvalita má přednost před cenou.

rules:
  proposal:
    - Piš česky. Nadpisy Intent, Scope (In scope / Out of scope), Approach, Dependencies, Done when.
    - U každé změny uveď fázi plánu (F0–F10) a podklad, ze kterého vychází (soubor a část).
  specs:
    - Piš česky; normativní slovo MUST nebo SHALL ponech anglicky (validace OpenSpec), např. „Systém MUST …“.
    - Každý požadavek má aspoň jeden scénář GIVEN/WHEN/THEN, včetně chybového nebo hraničního případu.
  design:
    - Nadpisy Technical Approach, Architecture Decisions, Data Flow, File Changes; odkazuj na skutečné soubory a třídy.
  tasks:
    - Úkoly konkrétní a ověřitelné (soubor, třída, test); u každé skupiny test, který dokazuje hotovo.
    - Placené běhy (Jev, OpenAI) jako samostatný úkol „odhad ceny + souhlas uživatele“.
