<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Bočné menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Figtree",system-ui,sans-serif;background:#FFFFFF;color:#17191C}
a{color:#17191C}a:hover{color:#0E5A52}
</style>
</helmet>
<aside style="width: 248px; height: 960px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E2E0D8; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; font-family: 'Figtree', system-ui, sans-serif; color: #17191C;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
<div style="width: 30px; height: 30px; border-radius: 8px; background: #0E5A52; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"></path></svg>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700;">EshopGuard</span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 64px; padding: 0 12px; border: 1px solid #E2E0D8; border-radius: 10px; background: #FBFAF7; font-family: inherit; text-align: left; color: #17191C;">
<span style="display: flex; flex-direction: column;">
<span style="font-size: 12px; color: #5F646C;">E-shop</span>
<span style="font-size: 15px; font-weight: 600;">bylinkovo.sk</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #4A4F57;"><span style="width: 7px; height: 7px; border-radius: 999px; background: #2E9E5B;"></span>Pripojené cez Shoptet</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<nav aria-label="Hlavné menu" style="display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" style="{{item.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1;">{{item.label}}</span>
<sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
<span style="{{item.countStyle}}">{{item.count}}</span>
</sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
<a href="Billing.dc.html" style="text-decoration: none; color: #17191C; background: #F6F5F1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 13px; font-weight: 600;">Sledovanie zmien</span><span style="font-size: 12px; color: #5F646C;">{{monitoringCount}}</span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #33373D;"><span style="width: 7px; height: 7px; border-radius: 999px; background: #2E9E5B;"></span>Aktívne, celé e-shopy</span>
<span style="font-size: 12px; color: #5F646C;">{{monitoringNote}}</span>
</a>
<div style="position: relative; border-top: 1px solid #EFEEE8; padding-top: 12px;">
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav aria-label="Účet" style="position: absolute; left: 0; right: 0; bottom: 70px; z-index: 10; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 12px; box-shadow: 0 14px 36px rgba(23, 25, 28, 0.16); padding: 6px; display: flex; flex-direction: column; gap: 2px;">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 10px; border-bottom: 1px solid #EFEEE8; margin-bottom: 4px;">
<span style="font-size: 12px; color: #5F646C;">Účet</span>
<span style="font-size: 14px; font-weight: 600;">Bylinkovo s. r. o.</span>
<span style="font-size: 12px; color: #5F646C;">jana@bylinkovo.sk</span>
</div>
<sc-for list="{{account}}" as="item" hint-placeholder-count="2">
<a href="{{item.href}}" style="{{item.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1;">{{item.label}}</span>
<span style="font-size: 13px; color: #5F646C;">{{item.value}}</span>
</a>
</sc-for>
<div style="height: 1px; background: #EFEEE8; margin: 4px 0;"></div>
<a href="Login.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; color: #4A4F57;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>
<span style="flex-grow: 1;">Odhlásiť sa</span>
</a>
</nav>
</sc-if>
<button type="button" onClick="{{toggleMenu}}" aria-haspopup="true" aria-expanded="{{menuExpanded}}" aria-label="Menu účtu Jana Kováčová" style="{{accountStyle}}">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #E3F0ED; color: #0B4A43; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">JK</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; text-align: left;">
<span style="font-size: 14px; font-weight: 600;">Jana Kováčová</span>
<span style="font-size: 12px; color: #5F646C;">Majiteľka účtu</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{chevron}}"></path></svg>
</button>
</div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","fixes","evidence","monitoring","billing","settings"],"default":"dashboard"},"menuOpen":{"editor":"boolean","default":false},"monitoringCount":{"editor":null,"default":"2 e-shopy"},"monitoringNote":{"editor":null,"default":"Prvá platba 1. 11. 2026"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'dashboard';
const open = this.state && this.state.open != null ? this.state.open : (this.props.menuOpen ?? false);
const base = 'display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 500; text-decoration: none;';
const items = [
{ id: 'dashboard', label: 'Prehľad', href: 'Dashboard.dc.html', d: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
{ id: 'fixes', label: 'Opravy', href: 'Fixes.dc.html', d: 'M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4', count: '24' },
{ id: 'evidence', label: 'Doklady', href: 'Evidence.dc.html', d: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13l2 2 4-4', count: '1' },
{ id: 'monitoring', label: 'Sledovanie zmien', href: 'Monitoring.dc.html', d: 'M3 12h4l2.5-6 5 12 2.5-6H21', count: '3' },
];
const account = [
{ id: 'billing', label: 'Predplatné a platby', href: 'Billing.dc.html', d: 'M3 6h18v12H3zM3 10h18M7 15h4' },
{ id: 'settings', label: 'Nastavenia', href: 'Dashboard.dc.html', d: 'M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4' },
{ id: 'language', label: 'Jazyk', value: 'Slovenčina', href: '#', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z' },
];
const small = 'display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none;';
const inAccount = active === 'billing' || active === 'settings';
const accountStyle = 'width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px; border-radius: 10px; font-family: inherit; color: #17191C; cursor: pointer; border: 1px solid '
+ (open ? '#CFCCC2; background: #F6F5F1;' : inAccount ? '#E3F0ED; background: #E3F0ED;' : 'transparent; background: transparent;');
return {
monitoringCount: this.props.monitoringCount ?? '2 e-shopy',
monitoringNote: this.props.monitoringNote ?? 'Prvá platba 1. 11. 2026',
menuOpen: open,
menuExpanded: open ? 'true' : 'false',
toggleMenu: () => this.setState({ open: !open }),
chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
accountStyle,
items: items.map((item) => {
const on = item.id === active;
return {
...item,
hasCount: Boolean(item.count),
style: base + (on ? ' background: #E3F0ED; color: #0B4A43; font-weight: 600;' : ' color: #33373D;'),
countStyle: 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;' + (on ? ' background: #0E5A52; color: #FFFFFF;' : ' background: #EFEEE8; color: #4A4F57;'),
};
}),
account: account.map((item) => ({
...item,
value: item.value ?? '',
style: small + (item.id === active ? ' background: #E3F0ED; color: #0B4A43; font-weight: 600;' : ' color: #33373D;'),
})),
};
}
}
</script>
</body>
</html>
